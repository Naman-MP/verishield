<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VeriBar</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header><span>VERIBAR</span><span class="mark">// V.01</span></header>
  <main>
    <p class="eyebrow">LOCAL CONTENT SIGNAL</p>
    <div class="switch-row">
      <label for="active">EXTENSION</label>
      <input type="checkbox" id="active" aria-label="Enable VeriBar">
    </div>
    <div class="stat"><span>TEXT ITEMS SCANNED</span><strong id="scanned">—</strong></div>
    <div class="stat"><span>AVG GPT-2-LIKE SCORE</span><strong id="average">—</strong></div>
    <div class="stat"><span>LOCAL PATTERN RESULTS</span><strong id="patterns">—</strong></div>
    <button id="rescan" type="button">RESCAN THIS PAGE ↗</button>
    <p id="status" role="status">Checking current page…</p>
  </main>
  <footer>Text scores are estimates. Media is not analyzed.</footer>
  <script src="popup.js"></script>
</body>
</html>
